<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mundial 2026 - Fixture Profesional</title>
<style>
:root{--bg:#0b1220;--card:#162033;--accent:#22c55e;--text:#e5e7eb}
*{box-sizing:border-box}
body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}
header{padding:24px;text-align:center;background:linear-gradient(90deg,#0ea5e9,#1d4ed8)}
.container{max-width:1400px;margin:auto;padding:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.card{background:var(--card);border-radius:14px;padding:14px}
h2,h3{margin-top:0}
table{width:100%;border-collapse:collapse}
th,td{border:1px solid #334155;padding:6px;text-align:center}
input[type=text]{width:100%;background:#0f172a;color:white;border:1px solid #475569;padding:4px}
input[type=number]{width:60px;background:#0f172a;color:white;border:1px solid #475569;padding:4px}
button{padding:10px 16px;border:none;border-radius:8px;background:var(--accent);cursor:pointer;font-weight:bold}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}
.small{font-size:.85rem;color:#94a3b8}
</style>
</head>
<body>
<header>
<h1>🏆 Mundial 2026 - Gestor Profesional de Fixture</h1>
<p>Archivo único listo para GitHub Pages</p>
</header>

<div class="container">
<div class="actions">
<button onclick="guardar()">Guardar</button>
<button onclick="cargar()">Cargar</button>
<button onclick="localStorage.clear();location.reload()">Reiniciar</button>
</div>

<h2>Fase de Grupos</h2>
<div class="grid" id="groups"></div>

<h2>Fase Eliminatoria</h2>
<div class="grid">
<div class="card"><h3>Dieciseisavos / Octavos</h3><div id="r16"></div></div>
<div class="card"><h3>Cuartos</h3><div id="qf"></div></div>
<div class="card"><h3>Semifinales</h3><div id="sf"></div></div>
<div class="card"><h3>Final</h3><div id="final"></div></div>
</div>
</div>

<script>
const letras="ABCDEFGHIJKL".split("");

function crearGrupo(l){
return `
<div class="card">
<h3>Grupo ${l}</h3>
<table>
<tr><th>Equipo</th><th>PJ</th><th>PTS</th></tr>
${[1,2,3,4].map(i=>`
<tr>
<td><input type="text" value="Equipo ${l}${i}"></td>
<td>0</td>
<td>0</td>
</tr>`).join("")}
</table>
<p class="small">Editable. Puedes reemplazar los nombres de equipos.</p>
</div>`;
}

document.getElementById("groups").innerHTML=letras.map(crearGrupo).join("");

function bracket(id,cant,prefix){
let h='<table><tr><th>Local</th><th></th><th></th><th>Visitante</th></tr>';
for(let i=1;i<=cant;i++){
h+=`<tr>
<td><input type="text" value="${prefix}${i}A"></td>
<td><input type="number"></td>
<td><input type="number"></td>
<td><input type="text" value="${prefix}${i}B"></td>
</tr>`;
}
h+='</table>';
document.getElementById(id).innerHTML=h;
}

bracket("r16",16,"Llave ");
bracket("qf",8,"Cuarto ");
bracket("sf",4,"Semi ");
bracket("final",1,"Final ");

function guardar(){
const datos=[];
document.querySelectorAll("input").forEach(x=>datos.push(x.value));
localStorage.setItem("mundial2026_pro",JSON.stringify(datos));
alert("Guardado correctamente");
}
function cargar(){
const datos=JSON.parse(localStorage.getItem("mundial2026_pro")||"[]");
document.querySelectorAll("input").forEach((x,i)=>{
if(datos[i]!==undefined)x.value=datos[i];
});
}
cargar();
</script>
</body>
</html>
